<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>图片拼接器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 12px;
            color: #1f2937;
        }

        .app-card {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            padding: 24px 24px 16px;
            background: white;
            border-bottom: 1px solid #edf2f7;
        }
        .header h1 {
            font-size: 1.6rem;
            font-weight: 600;
            background: linear-gradient(135deg, #1e2a3a, #2c3e66);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
        }
        .header p {
            color: #64748b;
            font-size: 0.85rem;
        }

        .control-bar {
            padding: 16px 24px;
            background: #ffffff;
            border-bottom: 1px solid #eef2f6;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            justify-content: space-between;
        }
        .info-tip {
            background: #f1f5f9;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            color: #475569;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        button {
            border: none;
            background: #f1f5f9;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            color: #1e293b;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        button.primary {
            background: #2c3e66;
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        button.primary:hover {
            background: #1e2f4b;
            transform: translateY(-1px);
        }
        button.outline-danger {
            background: #fff1f0;
            color: #b91c1c;
        }
        button.outline-danger:hover {
            background: #fee2e2;
        }
        button.download-btn {
            background: #059669;
            color: white;
        }
        button.download-btn:hover {
            background: #047857;
        }
        button:hover {
            transform: translateY(-1px);
        }

        .images-area {
            padding: 16px 24px 12px;
            background: #fefefe;
            border-bottom: 1px solid #edf2f8;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .section-header h3 {
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
        }
        .badge {
            background: #eef2ff;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #1f3a8a;
        }
        .image-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            min-height: 110px;
        }
        .img-thumb {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            width: 90px;
            transition: 0.15s;
            border: 1px solid #eef2f8;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
        }
        .img-thumb:active {
            transform: scale(0.97);
        }
        .thumb-img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            background: #f8fafc;
            display: block;
            pointer-events: none;
        }
        .thumb-actions {
            display: flex;
            justify-content: space-between;
            padding: 6px 6px;
            background: white;
            border-top: 1px solid #f0f2f5;
        }
        .thumb-actions button {
            background: transparent;
            padding: 4px 6px;
            font-size: 0.6rem;
            border-radius: 30px;
            font-weight: 500;
            box-shadow: none;
            pointer-events: auto;
        }
        .move-up, .move-down {
            background: #f1f4f9;
            color: #334155;
        }
        .delete-btn {
            background: #fff1f0;
            color: #c2410c;
        }
        .empty-placeholder {
            width: 100%;
            text-align: center;
            padding: 32px 16px;
            background: #fafcff;
            border-radius: 28px;
            color: #94a3b8;
            font-size: 0.8rem;
        }

        /* 预览区 - 使用 img 标签替代 canvas 以便长按保存 */
        .preview-area {
            padding: 16px 24px 24px;
            background: #f8fafc;
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .preview-header h3 {
            font-weight: 700;
            font-size: 1rem;
            color: #0f172a;
        }
        .preview-img-container {
            background: #eef2f6;
            border-radius: 24px;
            padding: 16px;
            text-align: center;
            overflow-x: auto;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.03), 0 8px 20px rgba(0,0,0,0.05);
        }
        #previewImage {
            max-width: 100%;
            height: auto;
            background: #fef9ef;
            border-radius: 16px;
            box-shadow: 0 8px 20px -8px rgba(0,0,0,0.2);
            display: block;
            margin: 0 auto;
        }
        .info-note {
            margin-top: 12px;
            font-size: 0.7rem;
            color: #5b6e8c;
            background: #eef2f6;
            display: inline-block;
            padding: 5px 14px;
            border-radius: 40px;
        }
        .save-guide {
            background: #e6f7ec;
            border-radius: 40px;
            padding: 6px 14px;
            font-size: 0.7rem;
            color: #047857;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
        }
        footer {
            padding: 14px 24px 20px;
            text-align: center;
            font-size: 0.65rem;
            color: #94a3b8;
            border-top: 1px solid #edf2f8;
            background: white;
        }

        /* 模态框 - 点击缩略图放大查看并长按保存单张 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            backdrop-filter: blur(8px);
        }
        .modal.active {
            display: flex;
        }
        .modal-img {
            max-width: 90%;
            max-height: 80%;
            object-fit: contain;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            background: #1e1e2a;
        }
        .modal-close {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(8px);
            border: none;
            font-size: 28px;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .modal-tip {
            margin-top: 20px;
            color: #ffecb3;
            background: rgba(0,0,0,0.5);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.8rem;
        }
        @media (max-width: 650px) {
            .control-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .actions {
                justify-content: space-between;
            }
            .img-thumb {
                width: 80px;
            }
            .thumb-img {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>
<div class="app-card">
    <div class="header">
        <h1>📸 图片拼接 · 纵向长图</h1>
        <p>多张图片垂直无缝拼接 | 保留原始宽度 | 点击下载直接保存到相册</p>
    </div>

    <div class="control-bar">
        <div class="info-tip">
            🖼️ 保持原始宽度，垂直首尾相接
        </div>
        <div class="actions">
            <button id="addImagesBtn" class="primary">➕ 添加图片</button>
            <button id="clearAllBtn" class="outline-danger">🗑️ 清空</button>
            <input type="file" id="hiddenFileInput" multiple accept="image/jpeg,image/png,image/webp,image/bmp" style="display: none;">
        </div>
    </div>

    <div class="images-area">
        <div class="section-header">
            <h3>🖼️ 图片顺序 (上移/下移调整拼接顺序)</h3>
            <span class="badge" id="countBadge">0张</span>
        </div>
        <div id="imageListStrip" class="image-strip">
            <div class="empty-placeholder">✨ 点击「添加图片」选择照片，支持多选，按顺序纵向拼接</div>
        </div>
        <div style="margin-top: 12px; font-size: 0.65rem; color: #6c86a3; text-align: center;">
            💡 点击任意缩略图可放大，长按放大图即可保存单张图片到相册
        </div>
    </div>

    <div class="preview-area">
        <div class="preview-header">
            <h3>⬇️ 拼接预览 · 长按下方图片可直接保存到相册</h3>
            <button id="downloadLongBtn" class="download-btn">💾 保存完整长图到相册</button>
        </div>
        <div class="preview-img-container">
            <img id="previewImage" alt="拼接预览图" style="max-width:100%; background:#fdf8ed;">
        </div>
        <div style="text-align:center; margin-top: 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;">
            <span class="info-note">🔗 图片无间距 · 垂直首尾相连</span>
            <span class="save-guide">✨ 长按上方图片 → 保存到相册 (手机)</span>
        </div>
    </div>
    <footer>
        💡 点击「保存完整长图到相册」按钮，图片会自动下载；长按预览图同样可以直接保存
    </footer>
</div>

<!-- 模态框 用于放大缩略图并支持长按保存 -->
<div id="imageModal" class="modal">
    <button class="modal-close" id="modalCloseBtn">✕</button>
    <img id="modalImage" class="modal-img" alt="放大图片">
    <div class="modal-tip">✨ 长按图片可保存到相册 | 点击外部关闭</div>
</div>

<script>
    (function(){
        // ---------- DOM 元素 ----------
        const addImagesBtn = document.getElementById('addImagesBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const hiddenFileInput = document.getElementById('hiddenFileInput');
        const imageListStrip = document.getElementById('imageListStrip');
        const previewImage = document.getElementById('previewImage');
        const downloadLongBtn = document.getElementById('downloadLongBtn');
        const countBadge = document.getElementById('countBadge');
        const modal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        // ---------- 核心数据 ----------
        let imagesQueue = [];  // 存储 { imgElement, naturalW, naturalH }

        // 更新角标
        function updateCountBadge() {
            const len = imagesQueue.length;
            countBadge.innerText = len + '张';
        }

        // 显示简单提示（alert 或 临时浮动）
        function showMessage(msg, isError = false) {
            // 使用轻提示风格，如果用户需要可以改成toast，此处用alert简洁可靠
            // 但为了体验，只在必要时提醒
            if (isError) {
                alert(msg);
            } else if (msg) {
                // 可选临时顶部提示（简化处理，用alert不太友好，改用小弹框风格简单）
                const tip = document.createElement('div');
                tip.textContent = msg;
                tip.style.position = 'fixed';
                tip.style.bottom = '80px';
                tip.style.left = '50%';
                tip.style.transform = 'translateX(-50%)';
                tip.style.backgroundColor = '#1e293bdd';
                tip.style.color = 'white';
                tip.style.padding = '8px 18px';
                tip.style.borderRadius = '40px';
                tip.style.fontSize = '0.8rem';
                tip.style.zIndex = '3000';
                tip.style.backdropFilter = 'blur(8px)';
                tip.style.whiteSpace = 'nowrap';
                document.body.appendChild(tip);
                setTimeout(() => tip.remove(), 2000);
            }
        }

        // 渲染缩略图列表
        function renderThumbnailList() {
            if (!imagesQueue.length) {
                imageListStrip.innerHTML = `<div class="empty-placeholder">📷 暂无图片，点击添加图片开始拼接 (保留原始宽度纵向长图)</div>`;
                updateCountBadge();
                return;
            }

            let html = '';
            imagesQueue.forEach((item, idx) => {
                const imgSrc = item.imgElement.src;
                html += `
                    <div class="img-thumb" data-index="${idx}" data-src="${imgSrc}">
                        <img class="thumb-img" src="${imgSrc}" alt="thumb" loading="lazy">
                        <div class="thumb-actions">
                            <button class="move-up" data-idx="${idx}" ${idx === 0 ? 'disabled style="opacity:0.4;"' : ''}>⬆️ 上移</button>
                            <button class="move-down" data-idx="${idx}" ${idx === imagesQueue.length-1 ? 'disabled style="opacity:0.4;"' : ''}>⬇️ 下移</button>
                            <button class="delete-btn" data-idx="${idx}">✖️ 删</button>
                        </div>
                    </div>
                `;
            });
            imageListStrip.innerHTML = html;
            updateCountBadge();

            // 绑定移动/删除事件
            document.querySelectorAll('.move-up').forEach(btn => {
                if(btn.disabled) return;
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = parseInt(btn.dataset.idx);
                    moveImage(idx, 'up');
                });
            });
            document.querySelectorAll('.move-down').forEach(btn => {
                if(btn.disabled) return;
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = parseInt(btn.dataset.idx);
                    moveImage(idx, 'down');
                });
            });
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = parseInt(btn.dataset.idx);
                    deleteImage(idx);
                });
            });

            // 缩略图点击放大 (支持长按保存)
            document.querySelectorAll('.img-thumb').forEach(thumb => {
                thumb.addEventListener('click', (e) => {
                    if(e.target.tagName === 'BUTTON') return;
                    const idxAttr = thumb.getAttribute('data-index');
                    if(idxAttr !== null) {
                        const idx = parseInt(idxAttr);
                        const imgObj = imagesQueue[idx];
                        if(imgObj && imgObj.imgElement) {
                            modalImage.src = imgObj.imgElement.src;
                            modal.classList.add('active');
                        }
                    }
                });
            });
        }

        // 移动顺序
        function moveImage(index, direction) {
            if (direction === 'up' && index > 0) {
                [imagesQueue[index-1], imagesQueue[index]] = [imagesQueue[index], imagesQueue[index-1]];
                renderThumbnailList();
                generateMosaicAndDisplay();
            } else if (direction === 'down' && index < imagesQueue.length-1) {
                [imagesQueue[index+1], imagesQueue[index]] = [imagesQueue[index], imagesQueue[index+1]];
                renderThumbnailList();
                generateMosaicAndDisplay();
            }
        }

        // 删除图片
        function deleteImage(index) {
            if (index >= 0 && index < imagesQueue.length) {
                imagesQueue.splice(index, 1);
                renderThumbnailList();
                generateMosaicAndDisplay();
            }
        }

        // 清空所有
        function clearAllImages() {
            if (imagesQueue.length === 0) return;
            imagesQueue = [];
            renderThumbnailList();
            generateMosaicAndDisplay();
            showMessage('已清空所有图片');
        }

        // 核心: 纵向拼接 (保留原始宽度，画布宽度取最宽图片，每张居中)
        // 返回生成的图片 DataURL
        async function generateMosaicDataURL() {
            if (imagesQueue.length === 0) {
                return null;
            }

            // 确保所有图片完全加载
            for (let item of imagesQueue) {
                const img = item.imgElement;
                if (!img.complete || img.naturalWidth === 0) {
                    await new Promise((resolve) => {
                        if (img.complete && img.naturalWidth > 0) resolve();
                        else {
                            img.onload = () => resolve();
                            img.onerror = () => resolve();
                        }
                    });
                }
            }

            let itemsInfo = [];
            let maxWidth = 0;
            for (let item of imagesQueue) {
                const img = item.imgElement;
                const w = img.naturalWidth;
                const h = img.naturalHeight;
                if (w === 0 || h === 0) continue;
                itemsInfo.push({
                    img: img,
                    origW: w,
                    origH: h,
                });
                if (w > maxWidth) maxWidth = w;
            }
            if (itemsInfo.length === 0) return null;

            let totalHeight = 0;
            for (let it of itemsInfo) totalHeight += it.origH;

            const MAX_CANVAS_HEIGHT = 14000;
            let finalHeight = totalHeight;
            let finalItems = [...itemsInfo];
            let scaleRatio = 1;
            if (totalHeight > MAX_CANVAS_HEIGHT) {
                scaleRatio = MAX_CANVAS_HEIGHT / totalHeight;
                finalHeight = MAX_CANVAS_HEIGHT;
                finalItems = itemsInfo.map(it => ({
                    img: it.img,
                    drawW: it.origW * scaleRatio,
                    drawH: it.origH * scaleRatio
                }));
                maxWidth = maxWidth * scaleRatio;
            } else {
                finalItems = itemsInfo.map(it => ({
                    img: it.img,
                    drawW: it.origW,
                    drawH: it.origH
                }));
            }

            const canvasWidth = Math.floor(maxWidth);
            const canvasHeight = Math.floor(finalHeight);
            const canvas = document.createElement('canvas');
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "#fef9ef";
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            
            let currentY = 0;
            for (let it of finalItems) {
                const drawW = it.drawW;
                const drawH = it.drawH;
                if (drawW > 0 && drawH > 0) {
                    const offsetX = (canvasWidth - drawW) / 2;
                    ctx.drawImage(it.img, offsetX, currentY, drawW, drawH);
                }
                currentY += drawH;
            }
            return canvas.toDataURL('image/png');
        }

        // 生成并显示到 img 标签中 (以便用户长按保存)
        async function generateMosaicAndDisplay() {
            if (imagesQueue.length === 0) {
                previewImage.src = '';
                previewImage.alt = '暂无图片，请添加';
                // 设置一个占位背景
                return;
            }
            try {
                const dataURL = await generateMosaicDataURL();
                if (dataURL) {
                    previewImage.src = dataURL;
                    previewImage.alt = '拼接长图 (长按可保存)';
                } else {
                    previewImage.src = '';
                }
            } catch(err) {
                console.error(err);
                showMessage('生成失败，请重试', true);
            }
        }

        // 下载完整长图 (直接保存到相册/下载)
        async function downloadFullImage() {
            if (imagesQueue.length === 0) {
                alert("还没有任何图片，请先添加图片");
                return;
            }
            try {
                const dataURL = await generateMosaicDataURL();
                if (!dataURL) {
                    alert("生成图片失败");
                    return;
                }
                const link = document.createElement('a');
                const timestamp = new Date().toISOString().slice(0,19).replace(/:/g, '-');
                link.download = `拼接长图_${timestamp}.png`;
                link.href = dataURL;
                link.click();
                showMessage('✅ 已开始下载，请查看相册或下载文件夹');
            } catch (err) {
                alert("下载失败，可尝试长按预览图保存");
            }
        }

        // 加载图片
        async function loadImagesFromFiles(files) {
            if (!files || files.length === 0) return;
            const fileArray = Array.from(files).filter(f => f.type.startsWith('image/'));
            if (fileArray.length === 0) {
                alert("请选择图片文件 (jpg/png/webp等)");
                return;
            }

            const loadTasks = [];
            for (let file of fileArray) {
                const task = new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            resolve({
                                imgElement: img,
                                naturalW: img.naturalWidth,
                                naturalH: img.naturalHeight,
                                src: e.target.result
                            });
                        };
                        img.onerror = () => resolve(null);
                        img.src = e.target.result;
                    };
                    reader.onerror = () => resolve(null);
                    reader.readAsDataURL(file);
                });
                loadTasks.push(task);
            }

            const loadedResults = await Promise.all(loadTasks);
            const validImages = [];
            for (let res of loadedResults) {
                if (res && res.imgElement && res.imgElement.naturalWidth > 0) {
                    validImages.push({
                        imgElement: res.imgElement,
                        naturalW: res.naturalW,
                        naturalH: res.naturalH
                    });
                }
            }

            if (validImages.length === 0) {
                alert("图片加载失败，请检查文件格式");
                return;
            }

            imagesQueue.push(...validImages);
            renderThumbnailList();
            await generateMosaicAndDisplay();
            showMessage(`✅ 已添加 ${validImages.length} 张图片`);
        }

        // 上传交互
        function bindUpload() {
            addImagesBtn.addEventListener('click', () => {
                hiddenFileInput.click();
            });
            hiddenFileInput.addEventListener('change', (e) => {
                if (hiddenFileInput.files && hiddenFileInput.files.length) {
                    loadImagesFromFiles(hiddenFileInput.files);
                    hiddenFileInput.value = '';
                }
            });
        }

        // 清空
        function bindClear() {
            clearAllBtn.addEventListener('click', () => {
                if (imagesQueue.length > 0 && confirm("清空所有图片？")) {
                    clearAllImages();
                }
            });
        }

        // 下载按钮
        function bindDownload() {
            downloadLongBtn.addEventListener('click', () => {
                downloadFullImage();
            });
        }

        // 模态框关闭逻辑
        function bindModal() {
            modalCloseBtn.addEventListener('click', () => {
                modal.classList.remove('active');
            });
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        }

        // 初始占位
        function initPlaceholder() {
            previewImage.src = '';
            previewImage.alt = '添加图片后自动生成拼接长图';
            previewImage.style.backgroundColor = '#fef9ef';
            previewImage.style.minHeight = '150px';
        }

        function init() {
            bindUpload();
            bindClear();
            bindDownload();
            bindModal();
            initPlaceholder();
            renderThumbnailList();
            // 无图片时画板显示空白
        }
        
        init();
    })();
</script>
</body>
</html>
