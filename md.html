<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown 查看编辑器</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#ffffff; --panel:#f6f7fa; --border:#dcdce6;
    --text:#26262e; --muted:#7a7a8c; --accent:#3b6ef0;
  }
  html,body { height:100%; }
  body {
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); display:flex; flex-direction:column;
  }
  #toolbar {
    display:flex; align-items:center; gap:8px; padding:8px 12px;
    background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap;
  }
  #toolbar .title { font-weight:600; margin-right:8px; }
  button {
    background:#eceef5; color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:6px 14px; cursor:pointer; font-size:13px;
  }
  button:hover { background:#dde1ee; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { filter:brightness(1.1); }
  #fileName { color:var(--muted); font-size:13px; margin-left:auto; }
  #stats { color:var(--muted); font-size:12px; }
  #main { flex:1; display:flex; min-height:0; }
  #editor, #preview {
    flex:1; padding:16px 20px; overflow:auto; font-size:15px; line-height:1.7;
  }
  #editor {
    background:var(--bg); color:var(--text); border:none; outline:none;
    caret-color:var(--accent);
    resize:none; font-family:"SF Mono",Menlo,Consolas,monospace; font-size:14px;
    border-right:1px solid var(--border); white-space:pre; tab-size:4;
  }
  #preview { background:var(--panel); }
  body.preview-only #editor { display:none; }
  body.edit-only #preview { display:none; }
  #dropMask {
    position:fixed; inset:0; background:rgba(108,140,255,.15); z-index:99;
    display:none; align-items:center; justify-content:center; font-size:24px;
    pointer-events:none; border:3px dashed var(--accent); border-radius:12px; margin:10px;
  }
  /* ---- 预览样式 ---- */
  #preview h1,#preview h2 { border-bottom:1px solid var(--border); padding-bottom:.3em; }
  #preview h1{font-size:1.9em} #preview h2{font-size:1.5em} #preview h3{font-size:1.25em}
  #preview h4{font-size:1.1em}
  #preview code { background:#eceef5; padding:2px 6px; border-radius:4px;
    font-family:"SF Mono",Menlo,Consolas,monospace; font-size:.88em; }
  #preview pre { background:#f2f3f8; padding:14px; border-radius:8px; overflow:auto; margin:12px 0; }
  #preview pre code { background:none; padding:0; }
  #preview blockquote { border-left:4px solid var(--accent); padding:2px 16px;
    color:var(--muted); margin:12px 0; }
  #preview a { color:var(--accent); }
  #preview table { border-collapse:collapse; margin:12px 0; width:100%; }
  #preview th,#preview td { border:1px solid var(--border); padding:6px 12px; }
  #preview th { background:#eceef5; }
  #preview img { max-width:100%; }
  #preview ul,#preview ol { padding-left:1.6em; margin:8px 0; }
  #preview hr { border:none; border-top:1px solid var(--border); margin:16px 0; }
  #preview p { margin:8px 0; }
  #editor::placeholder { color:#a8a8b8; }
</style>
</head>
<body>
<div id="toolbar">
  <span class="title">📝 MD 编辑器</span>
  <button class="primary" id="btnOpen">打开 .md 文件</button>
  <button id="btnSave">保存 (⌘S)</button>
  <button id="btnExportHtml">导出 HTML</button>
  <button id="btnToggle">预览/编辑切换</button>
  <span id="stats"></span>
  <span id="fileName">未打开文件</span>
  <input type="file" id="fileInput" accept=".md,.markdown,.txt" style="display:none">
</div>
<div id="main">
  <textarea id="editor" placeholder="在这里输入 Markdown，或点击「打开 .md 文件」&#10;也可以直接把 .md 文件拖进窗口&#10;支持快捷键 ⌘/Ctrl + S 保存"></textarea>
  <div id="preview"></div>
</div>
<div id="dropMask">松开以打开文件</div>

<script>
const $ = id => document.getElementById(id);
const editor = $('editor'), preview = $('preview');
let currentName = '';

/* ---------- Markdown 解析 ---------- */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function inline(s){
  s = esc(s);
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img alt="$1" src="$2">');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>');
  s = s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<em>$2</em>').replace(/(^|[^_\w])_([^_\n]+)_/g,'$1<em>$2</em>');
  s = s.replace(/(^|\s)(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank">$2</a>');
  return s;
}

function mdToHtml(md){
  const lines = md.replace(/\r\n?/g,'\n').split('\n');
  let html = '', i = 0;
  const isTableSep = l => /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(l) && l.includes('-');

  while (i < lines.length){
    const line = lines[i];

    // 代码块
    if (/^\s*```/.test(line)){
      const lang = line.trim().slice(3);
      let code = []; i++;
      while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) code.push(lines[i++]);
      i++;
      html += `<pre><code class="lang-${esc(lang)}">${esc(code.join('\n'))}</code></pre>`;
      continue;
    }
    // 标题
    let m = line.match(/^(#{1,6})\s+(.*)/);
    if (m){ html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; i++; continue; }
    // 分割线
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)){ html += '<hr>'; i++; continue; }
    // 引用（支持连续多行）
    if (/^\s*>/.test(line)){
      let buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/,''));
      html += `<blockquote>${mdToHtml(buf.join('\n'))}</blockquote>`;
      continue;
    }
    // 表格
    if (line.includes('|') && i+1 < lines.length && isTableSep(lines[i+1])){
      const split = r => r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
      const heads = split(line); i += 2;
      let rows = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) rows.push(split(lines[i++]));
      html += '<table><thead><tr>' + heads.map(h=>`<th>${inline(h)}</th>`).join('') + '</tr></thead><tbody>'
            + rows.map(r=>'<tr>'+r.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')
            + '</tbody></table>';
      continue;
    }
    // 列表（支持嵌套与任务列表）
    if (/^\s*([-*+]|\d+\.)\s+/.test(line)){
      const parseList = (start) => {
        // 确定基准缩进
        let base = null, items = [];
        let j = start;
        while (j < lines.length){
          const lm = lines[j].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
          if (!lm) break;
          const indent = lm[1].replace(/\t/g,'  ').length;
          if (base === null) base = indent;
          if (indent < base) break;
          items.push({ indent, ordered: /\d/.test(lm[2]), text: lm[3] });
          j++;
        }
        return { items, end: j };
      };
      const { items, end } = parseList(i);
      i = end;
      const build = (list, idx, indent) => {
        let out = '';
        while (idx < list.length){
          const it = list[idx];
          if (it.indent < indent) break;
          if (it.indent > indent){ // 嵌套
            const sub = build(list, idx, it.indent);
            out = out.replace(/(<li[^>]*>)([^]*)$/, '$1' + sub.html);
            idx = sub.idx;
            continue;
          }
          let t = it.text;
          const task = t.match(/^\[( |x|X)\]\s+(.*)/);
          const content = task ? `<input type="checkbox" disabled ${task[1]!==' '?'checked':''}> ${inline(task[2])}` : inline(t);
          out += `<li>${content}</li>`;
          idx++;
        }
        return { html: out, idx };
      };
      // 简单两级嵌套处理
      let firstIndent = items[0].indent, liHtml = '', idx = 0;
      while (idx < items.length){
        const it = items[idx];
        if (it.indent === firstIndent){
          let t = it.text;
          const task = t.match(/^\[( |x|X)\]\s+(.*)/);
          let content = task ? `<input type="checkbox" disabled ${task[1]!==' '?'checked':''}> ${inline(task[2])}` : inline(t);
          liHtml += `<li>${content}`;
          idx++;
          // 收集子项
          let sub = '';
          while (idx < items.length && items[idx].indent > firstIndent){
            let st = items[idx].text;
            const stask = st.match(/^\[( |x|X)\]\s+(.*)/);
            sub += `<li>${stask ? `<input type="checkbox" disabled ${stask[1]!==' '?'checked':''}> ${inline(stask[2])}` : inline(st)}</li>`;
            idx++;
          }
          if (sub) liHtml += `<${items[idx-1].ordered?'ol':'ul'}>${sub}</${items[idx-1].ordered?'ol':'ul'}>`;
          liHtml += '</li>';
        }
      }
      html += `<${items[0].ordered?'ol':'ul'}>${liHtml}</${items[0].ordered?'ol':'ul'}>`;
      continue;
    }
    // 空行
    if (!line.trim()){ i++; continue; }
    // 段落
    let para = [line]; i++;
    while (i < lines.length && lines[i].trim()
        && !/^(#{1,6}\s|\s*>|```|\s*([-*+]|\d+\.)\s)/.test(lines[i])
        && !(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(lines[i]))
        && !(lines[i].includes('|') && i+1 < lines.length && isTableSep(lines[i+1]))){
      para.push(lines[i++]);
    }
    html += `<p>${para.map(inline).join('<br>')}</p>`;
  }
  return html;
}

/* ---------- 实时预览 ---------- */
let timer;
function update(){
  clearTimeout(timer);
  timer = setTimeout(() => {
    preview.innerHTML = mdToHtml(editor.value) || '<p style="color:#9a9ab0">（预览区域）</p>';
    const t = editor.value;
    $('stats').textContent = `字数 ${t.replace(/\s/g,'').length} · 行数 ${t ? t.split('\n').length : 0}`;
    localStorage.setItem('md_draft', t);
  }, 150);
}
editor.addEventListener('input', update);

/* ---------- 文件操作 ---------- */
function loadFile(file){
  const reader = new FileReader();
  reader.onload = e => {
    editor.value = e.target.result;
    currentName = file.name;
    $('fileName').textContent = '📄 ' + file.name;
    update();
  };
  reader.readAsText(file);
}
$('btnOpen').onclick = () => $('fileInput').click();
$('fileInput').onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0]); e.target.value=''; };

function download(name, content, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}
$('btnSave').onclick = () => {
  const name = currentName || 'untitled.md';
  download(name, editor.value, 'text/markdown');
};
$('btnExportHtml').onclick = () => {
  const name = (currentName || 'untitled').replace(/\.md$/i,'') + '.html';
  const doc = `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>${esc(name)}</title>
<style>body{max-width:820px;margin:40px auto;padding:0 20px;font-family:-apple-system,"PingFang SC",sans-serif;line-height:1.7}
code{background:#eee;padding:2px 6px;border-radius:4px}pre{background:#f5f5f5;padding:14px;border-radius:8px;overflow:auto}
pre code{background:none;padding:0}blockquote{border-left:4px solid #6c8cff;padding:2px 16px;color:#666}
table{border-collapse:collapse}th,td{border:1px solid #ccc;padding:6px 12px}img{max-width:100%}</style></head>
<body>${mdToHtml(editor.value)}</body></html>`;
  download(name, doc, 'text/html');
};

/* ---------- 快捷键 / 拖拽 / 自动恢复 ---------- */
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's'){ e.preventDefault(); $('btnSave').click(); }
});
let dragDepth = 0;
window.addEventListener('dragenter', e => { e.preventDefault(); if (++dragDepth === 1) $('dropMask').style.display='flex'; });
window.addEventListener('dragleave', e => { e.preventDefault(); if (--dragDepth <= 0){ dragDepth=0; $('dropMask').style.display='none'; } });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; $('dropMask').style.display='none';
  const f = e.dataTransfer.files[0];
  if (f) loadFile(f);
});

$('btnToggle').onclick = () => {
  const b = document.body;
  if (!b.className) b.className = 'preview-only';
  else if (b.className === 'preview-only') b.className = 'edit-only';
  else b.className = '';
};

// 恢复上次草稿
const draft = localStorage.getItem('md_draft');
if (draft){ editor.value = draft; }
update();
</script>
</body>
</html>
